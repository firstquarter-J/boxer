name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  boundary-check:
    name: Open Core Boundary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Verify open core boundary
        run: PYTHON_BIN=python ./scripts/verify_open_core_boundary.sh

  open-source-tests:
    name: Open Source Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build public-only checkout
        run: |
          public_root="/tmp/boxer-public-checkout"
          rm -rf "${public_root}"
          mkdir -p "${public_root}/tests"
          cp pyproject.toml README.md LICENSE .env.example "${public_root}/"
          cp -R boxer boxer_adapter_slack boxer_adapter_web widget examples scripts "${public_root}/"
          cp -R tests/open_source "${public_root}/tests/open_source"

      - name: Install public packages only
        working-directory: /tmp/boxer-public-checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e ./boxer_adapter_slack
          # TestClient 의존성은 공개 Web runtime이 아니라 test extra로만 설치한다.
          python -m pip install -e './boxer_adapter_web[test]'

      - name: Assert company packages are unavailable
        working-directory: /tmp/boxer-public-checkout
        run: |
          python - <<'PY'
          import importlib.util

          for package_name in (
              "boxer_company",
              "boxer_company_adapter_slack",
              "boxer_company_api",
          ):
              if importlib.util.find_spec(package_name) is not None:
                  raise SystemExit(f"{package_name} must not be importable in open-source CI")
          PY

      - name: Run open-source tests
        working-directory: /tmp/boxer-public-checkout
        env:
          BOXER_SKIP_DOTENV: "true"
        run: python -m unittest discover -s tests/open_source -q

  widget-build:
    name: Widget Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install widget dependencies
        working-directory: widget
        run: pnpm install --frozen-lockfile

      - name: Build widget
        working-directory: widget
        run: pnpm build

  company-tests:
    name: Company Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install all packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
          python -m pip install -e ./boxer_adapter_slack
          python -m pip install -e ./boxer_company
          python -m pip install -e ./boxer_company_adapter_slack
          python -m pip install -e ./boxer_company_api

      - name: Verify company API isolated wheel
        run: |
          wheel_root="$(mktemp -d)"
          api_venv_root="$(mktemp -d)"
          python -m pip wheel --no-deps --wheel-dir "${wheel_root}" .
          python -m pip wheel --no-deps --wheel-dir "${wheel_root}" ./boxer_company
          python -m pip wheel --no-deps --wheel-dir "${wheel_root}" ./boxer_company_api
          python -m venv "${api_venv_root}/venv"
          "${api_venv_root}/venv/bin/python" -m pip install \
            "${wheel_root}"/boxer-*.whl \
            "${wheel_root}"/boxer_company-*.whl \
            "${wheel_root}"/boxer_company_api-*.whl
          cd "${api_venv_root}"
          "${api_venv_root}/venv/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.util

          import boxer_company_api
          from boxer_company_api.runtime import main

          if not callable(main):
              raise SystemExit("boxer-company-api entrypoint must be callable")

          for package_name in (
              "boxer_adapter_slack",
              "boxer_company_adapter_slack",
              "boxer_adapter_web",
              "slack_bolt",
          ):
              if importlib.util.find_spec(package_name) is not None:
                  raise SystemExit(
                      f"{package_name} must not be installed with boxer-company-api"
                  )

          distribution = importlib.metadata.distribution(
              "boxer-company-api"
          )
          forbidden_paths = (
              "boxer_adapter_slack/",
              "boxer_company_adapter_slack/",
              "boxer_adapter_web/",
          )
          for file_path in distribution.files or ():
              normalized = str(file_path).replace("\\", "/")
              if normalized.startswith(forbidden_paths):
                  raise SystemExit(
                      f"adapter source leaked into API wheel: {normalized}"
                  )

          # API install unit만 company runtime extra를 선택한다.
          def module_available(name):
              try:
                  return importlib.util.find_spec(name) is not None
              except ModuleNotFoundError:
                  return False

          for provider_name in (
              "boto3",
              "cryptography",
              "google.auth",
              "paramiko",
              "pymysql",
              "redis",
          ):
              if not module_available(provider_name):
                  raise SystemExit(
                      f"company API runtime provider is missing: {provider_name}"
                  )
          PY

      - name: Verify company Slack provider-light wheel
        run: |
          wheel_root="$(mktemp -d)"
          slack_venv_root="$(mktemp -d)"
          python -m pip wheel --no-deps --wheel-dir "${wheel_root}" .
          python -m pip wheel --no-deps --wheel-dir "${wheel_root}" ./boxer_adapter_slack
          python -m pip wheel --no-deps --wheel-dir "${wheel_root}" ./boxer_company
          python -m pip wheel --no-deps --wheel-dir "${wheel_root}" ./boxer_company_adapter_slack
          python -m venv "${slack_venv_root}/venv"
          "${slack_venv_root}/venv/bin/python" -m pip install \
            "${wheel_root}"/boxer-*.whl \
            "${wheel_root}"/boxer_adapter_slack-*.whl \
            "${wheel_root}"/boxer_company-*.whl \
            "${wheel_root}"/boxer_company_adapter_slack-*.whl
          cd "${slack_venv_root}"
          "${slack_venv_root}/venv/bin/python" - <<'PY'
          import importlib.util
          import sys

          import boxer_company_adapter_slack

          if "boxer_company_adapter_slack.company" in sys.modules:
              raise SystemExit("Slack package facade eagerly loaded production entry")

          from boxer_company_adapter_slack.automation_api_client import (
              AutomationRemoteDeliveryBatch,
          )

          if AutomationRemoteDeliveryBatch.__name__ != "AutomationRemoteDeliveryBatch":
              raise SystemExit("Slack automation transport contract is unavailable")

          # 실제 production 조립부도 provider extra 없이 import되어야 한다.
          import boxer_company_adapter_slack.company

          for provider_prefix in (
              "anthropic",
              "boto3",
              "botocore",
              "cryptography",
              "google.auth",
              "paramiko",
              "pymysql",
              "redis",
          ):
              if any(
                  name == provider_prefix
                  or name.startswith(provider_prefix + ".")
                  for name in sys.modules
              ):
                  raise SystemExit(
                      f"domain provider loaded by Slack entry: {provider_prefix}"
                  )

          def module_available(name):
              try:
                  return importlib.util.find_spec(name) is not None
              except ModuleNotFoundError:
                  return False

          for provider_name in (
              "boto3",
              "cryptography",
              "google.auth",
              "paramiko",
              "pymysql",
              "redis",
          ):
              if module_available(provider_name):
                  raise SystemExit(
                      f"domain provider leaked into Slack install: {provider_name}"
                  )
          PY

      - name: Run company tests
        env:
          BOXER_SKIP_DOTENV: "true"
          AWS_REGION: ap-northeast-2
        run: |
          # State/recovery tests intentionally reject world-writable /tmp parents.
          protected_tmp_root="$(mktemp -d "${HOME}/boxer-company-tests.XXXXXX")"
          # tempfile.TemporaryDirectory도 보호 경로를 쓰게 해 Linux의 /tmp를 우회한다.
          TMPDIR="${protected_tmp_root}" python -m pytest -q \
            --basetemp="${protected_tmp_root}/pytest" \
            tests/company
