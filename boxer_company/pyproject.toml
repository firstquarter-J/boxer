[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxer-company"
version = "0.1.0"
description = "Company-specific domain package for Boxer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boxer>=0.1.0",
]

[project.optional-dependencies]
# Slack transport는 provider-free 계약만 설치하고, 실제 회사 도메인 실행
# 의존성은 공통 API install unit이 명시적으로 선택한다.
runtime = [
  "boxer[db,s3]>=0.1.0",
  "cryptography>=43,<49",
  "google-auth>=2.38,<3",
  "paramiko==3.5.1",
  "redis==5.0.8",
  "requests==2.32.3",
]

[project.scripts]
boxer-company-base-access-seed = "boxer_company.base_access_seed:main"
boxer-company-sms-recovery-state-init = "boxer_company.sms_recovery_state_initializer:main"

[project.urls]
Repository = "https://github.com/firstquarter-J/boxer"

[tool.setuptools]
packages = [
  "boxer_company",
  "boxer_company.assets",
  "boxer_company.assistant",
  "boxer_company.routers",
]

[tool.setuptools.package-dir]
boxer_company = "."
"boxer_company.assets" = "assets"
"boxer_company.assistant" = "assistant"
"boxer_company.routers" = "routers"

[tool.setuptools.package-data]
"boxer_company.assets" = ["*.sh"]
